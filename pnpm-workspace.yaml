allowBuilds:
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vitest: 5.1.0
  vite-plus: 1.5.1
  "@vitest/browser-playwright": 5.1.0
minimumReleaseAgeExclude:
  - "@sveltejs/kit@3.0.0"
  - "@sveltejs/adapter-auto@8.0.0"
  - "@sveltejs/adapter-cloudflare@8.0.0"
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
